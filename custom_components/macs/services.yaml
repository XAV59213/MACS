set_mood:
  name: Définir l’humeur
  description: Change l’humeur affichée par M.A.C.S.
  fields:
    mood:
      name: Humeur
      description: Humeur à appliquer.
      required: true
      selector:
        select:
          options:
            - idle
            - happy
            - sad
            - sleeping
            - listening
            - thinking
            - surprised
            - confused
            - bored
            - excited
            - calm
            - angry
            - tired

set_brightness:
  name: Définir la luminosité
  description: Change la luminosité de M.A.C.S.
  fields:
    brightness:
      name: Luminosité
      description: Valeur de luminosité entre 0 et 100 %.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
          unit_of_measurement: "%"

set_temperature:
  name: Définir la température
  description: Change la température utilisée par M.A.C.S.
  fields:
    temperature:
      name: Température
      description: Température utilisée par M.A.C.S.
      required: true
      selector:
        number:
          min: -30
          max: 50
          step: 0.1
          mode: box
          unit_of_measurement: "°C"

set_windspeed:
  name: Définir la vitesse du vent
  description: Change la vitesse du vent utilisée par M.A.C.S.
  fields:
    windspeed:
      name: Vitesse du vent
      description: Vitesse du vent utilisée par M.A.C.S.
      required: true
      selector:
        number:
          min: 0
          max: 200
          step: 0.1
          mode: box
          unit_of_measurement: "km/h"

set_precipitation:
  name: Définir les précipitations
  description: Change les précipitations utilisées par M.A.C.S.
  fields:
    precipitation:
      name: Précipitations
      description: Quantité ou intensité de précipitations utilisée par M.A.C.S.
      required: true
      selector:
        number:
          min: 0
          max: 200
          step: 0.1
          mode: box
          unit_of_measurement: "mm"

set_battery_charge:
  name: Définir la batterie
  description: Change le niveau de batterie utilisé par M.A.C.S.
  fields:
    battery_charge:
      name: Charge batterie
      description: Niveau de batterie entre 0 et 100 %.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
          unit_of_measurement: "%"

set_animations_enabled:
  name: Activer les animations
  description: Active ou désactive les animations de M.A.C.S.
  fields:
    animations_enabled:
      name: Animations activées
      description: Active les animations si vrai, les désactive si faux.
      required: true
      selector:
        boolean:

set_charging:
  name: Définir la charge
  description: Indique si M.A.C.S. est en charge.
  fields:
    charging:
      name: En charge
      description: Active l’état de charge si vrai.
      required: true
      selector:
        boolean:

